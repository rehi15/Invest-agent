<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI & 물류 자동화 뉴스</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
  }

  /* Header */
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(15,23,42,0.95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 34px; height: 34px; border-radius: 8px;
    background: linear-gradient(135deg, #7c3aed, #2563eb);
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .logo-title { font-size: 15px; font-weight: 700; color: #f1f5f9; }
  .logo-sub { font-size: 11px; color: #64748b; margin-top: 2px; }
  .live-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #94a3b8; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: #34d399;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* Hero */
  .hero {
    background: linear-gradient(180deg, rgba(30,41,59,0.5) 0%, transparent 100%);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    padding: 32px 24px 24px;
    max-width: 1200px; margin: 0 auto;
  }
  .hero h2 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  .hero p { font-size: 13px; color: #94a3b8; }

  /* Controls */
  .controls {
    max-width: 1200px; margin: 0 auto;
    padding: 20px 24px 0;
  }
  .search-wrap { position: relative; margin-bottom: 14px; }
  .search-wrap span {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    font-size: 14px; color: #64748b;
  }
  .search-input {
    width: 100%; padding: 11px 16px 11px 40px;
    background: rgba(30,41,59,0.6); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; color: #e2e8f0; font-size: 13px;
    outline: none; transition: border-color 0.2s, background 0.2s;
  }
  .search-input::placeholder { color: #475569; }
  .search-input:focus { border-color: rgba(124,58,237,0.5); background: rgba(30,41,59,0.9); }

  .tabs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tab {
    display: flex; align-items: center; gap: 5px;
    padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 500;
    border: 1px solid rgba(255,255,255,0.08); background: rgba(30,41,59,0.6);
    color: #94a3b8; cursor: pointer; transition: all 0.2s;
  }
  .tab:hover { background: rgba(51,65,85,0.7); color: #e2e8f0; }
  .tab.active { background: #7c3aed; border-color: #7c3aed; color: #fff; box-shadow: 0 4px 14px rgba(124,58,237,0.3); }
  .tab-refresh { margin-left: auto; }
  .tab-refresh:hover { background: rgba(51,65,85,0.7); color: #e2e8f0; }

  /* Status */
  .status-bar {
    max-width: 1200px; margin: 10px auto 0;
    padding: 0 24px; font-size: 11px; color: #475569;
  }

  /* Grid */
  .grid {
    max-width: 1200px; margin: 16px auto 0;
    padding: 0 24px 40px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 14px;
  }

  /* Card */
  .card {
    background: rgba(30,41,59,0.6); border: 1px solid rgba(255,255,255,0.07);
    border-radius: 14px; padding: 18px;
    text-decoration: none; color: inherit;
    display: flex; flex-direction: column; gap: 10px;
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
    cursor: pointer;
  }
  .card:hover {
    background: rgba(51,65,85,0.7); border-color: rgba(255,255,255,0.15);
    transform: translateY(-2px);
  }
  .card-top { display: flex; justify-content: space-between; align-items: center; }
  .badge {
    font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
  }
  .badge-ai { background: rgba(124,58,237,0.2); color: #a78bfa; border: 1px solid rgba(124,58,237,0.3); }
  .badge-logistics { background: rgba(37,99,235,0.2); color: #93c5fd; border: 1px solid rgba(37,99,235,0.3); }
  .badge-automation { background: rgba(5,150,105,0.2); color: #6ee7b7; border: 1px solid rgba(5,150,105,0.3); }
  .time { font-size: 11px; color: #475569; }
  .card-title {
    font-size: 13px; font-weight: 600; line-height: 1.5; color: #f1f5f9;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-summary {
    font-size: 12px; color: #64748b; line-height: 1.6;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-source { font-size: 11px; color: #475569; display: flex; align-items: center; gap: 5px; }
  .card-source::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: #334155; display: inline-block; }

  /* Skeleton */
  .skeleton { background: rgba(30,41,59,0.5); border: 1px solid rgba(255,255,255,0.05); border-radius: 14px; padding: 18px; }
  .skel-line { background: rgba(51,65,85,0.8); border-radius: 6px; animation: shimmer 1.5s infinite; }
  @keyframes shimmer { 0%,100%{opacity:0.5} 50%{opacity:1} }

  /* Empty */
  .empty { grid-column: 1/-1; text-align: center; padding: 60px 0; color: #475569; }
  .empty .icon { font-size: 40px; margin-bottom: 10px; }

  /* Footer */
  footer {
    border-top: 1px solid rgba(255,255,255,0.05);
    text-align: center; padding: 20px;
    font-size: 11px; color: #334155;
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🤖</div>
    <div>
      <div class="logo-title">AI & 물류 자동화</div>
      <div class="logo-sub">실시간 뉴스 피드</div>
    </div>
  </div>
  <div class="live-badge"><span class="dot"></span> 자동 업데이트</div>
</header>

<div class="hero">
  <h2>AI · 물류 · 자동화 최신 소식</h2>
  <p>인공지능, 공급망, 물류 자동화 분야의 글로벌 뉴스를 페이지 열 때마다 자동으로 수집합니다</p>
</div>

<div class="controls">
  <div class="search-wrap">
    <span>🔍</span>
    <input class="search-input" type="text" placeholder="뉴스 검색..." id="searchInput" oninput="renderCards()">
  </div>
  <div class="tabs">
    <button class="tab active" onclick="setCategory('all', this)">📰 전체</button>
    <button class="tab" onclick="setCategory('ai', this)">🤖 AI</button>
    <button class="tab" onclick="setCategory('logistics', this)">🚚 물류</button>
    <button class="tab" onclick="setCategory('automation', this)">⚙️ 자동화</button>
    <button class="tab tab-refresh" onclick="loadNews(true)">🔄 새로고침</button>
  </div>
</div>

<div class="status-bar" id="statusBar"></div>
<div class="grid" id="grid"></div>

<footer>AI & 물류 자동화 뉴스 · 뉴스는 외부 RSS 피드에서 자동 수집됩니다</footer>

<script>
const FEEDS = [
  { url: 'https://techcrunch.com/category/artificial-intelligence/feed/', source: 'TechCrunch AI', category: 'ai' },
  { url: 'https://feeds.feedburner.com/venturebeat/SZYF', source: 'VentureBeat AI', category: 'ai' },
  { url: 'https://www.technologyreview.com/feed/', source: 'MIT Tech Review', category: 'ai' },
  { url: 'https://www.supplychaindive.com/feeds/news/', source: 'Supply Chain Dive', category: 'logistics' },
  { url: 'https://www.logisticsmgmt.com/rss/news', source: 'Logistics Mgmt', category: 'logistics' },
  { url: 'https://www.automationworld.com/rss.xml', source: 'Automation World', category: 'automation' },
];

const MOCK = [
  { title: 'OpenAI, 물류 최적화 AI 모델 출시 — 배송 시간 30% 단축 효과', summary: 'OpenAI가 공급망 및 물류 최적화에 특화된 새로운 AI 모델을 공개했습니다. 실시간 교통 데이터와 수요 예측을 결합해 배송 경로를 최적화합니다.', url: '#', source: 'AI News', category: 'ai', publishedAt: new Date().toISOString() },
  { title: '아마존 물류센터, 자율주행 로봇 도입으로 피킹 효율 45% 향상', summary: '아마존이 최신 자율주행 로봇을 전국 물류센터에 배치하며 운영 효율성을 크게 높였습니다.', url: '#', source: 'Logistics Tech', category: 'logistics', publishedAt: new Date(Date.now()-3600000).toISOString() },
  { title: '제조 자동화 시장 2030년까지 연평균 9.8% 성장 전망', summary: '글로벌 리서치 기관에 따르면 AI 기반 제조 자동화 시장이 폭발적으로 성장하고 있습니다.', url: '#', source: 'Automation World', category: 'automation', publishedAt: new Date(Date.now()-7200000).toISOString() },
  { title: 'Google DeepMind, 창고 자동화를 위한 범용 로봇 AI 공개', summary: 'DeepMind의 새 로봇 AI는 다양한 물체를 인식하고 분류하는 데 있어 인간 수준의 정확도를 달성했습니다.', url: '#', source: 'MIT Tech Review', category: 'ai', publishedAt: new Date(Date.now()-10800000).toISOString() },
  { title: '현대자동차, AI 기반 스마트 물류 플랫폼 "H-Logistics" 론칭', summary: '현대자동차그룹이 자체 개발한 AI 물류 플랫폼을 공개하며 부품 조달부터 완성차 배송까지 전 과정을 디지털화합니다.', url: '#', source: 'Supply Chain Dive', category: 'logistics', publishedAt: new Date(Date.now()-14400000).toISOString() },
  { title: '드론 배송 자동화, 규제 완화로 국내 상용화 앞당겨질 전망', summary: '국토교통부가 도심 드론 배송 관련 규제를 대폭 완화하면서 CJ대한통운 등이 본격적인 서비스 확대를 준비 중입니다.', url: '#', source: 'Logistics Mgmt', category: 'automation', publishedAt: new Date(Date.now()-18000000).toISOString() },
];

let allNews = [];
let currentCategory = 'all';

function timeAgo(dateStr) {
  const diff = Date.now() - new Date(dateStr).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 60) return m + '분 전';
  const h = Math.floor(m / 60);
  if (h < 24) return h + '시간 전';
  return Math.floor(h / 24) + '일 전';
}

function stripHtml(html) {
  return (html || '').replace(/<[^>]*>/g, '').replace(/&[a-z]+;/g, ' ').trim();
}

function showSkeleton() {
  const grid = document.getElementById('grid');
  grid.innerHTML = Array.from({length: 6}).map(() => `
    <div class="skeleton">
      <div class="skel-line" style="width:50px;height:18px;margin-bottom:12px"></div>
      <div class="skel-line" style="width:100%;height:14px;margin-bottom:6px"></div>
      <div class="skel-line" style="width:80%;height:14px;margin-bottom:12px"></div>
      <div class="skel-line" style="width:100%;height:11px;margin-bottom:4px"></div>
      <div class="skel-line" style="width:65%;height:11px"></div>
    </div>
  `).join('');
}

function renderCards() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  let items = currentCategory === 'all' ? allNews : allNews.filter(n => n.category === currentCategory);
  if (q) items = items.filter(n => n.title.toLowerCase().includes(q) || (n.summary||'').toLowerCase().includes(q));

  const grid = document.getElementById('grid');
  if (!items.length) {
    grid.innerHTML = '<div class="empty"><div class="icon">📭</div><p>검색 결과가 없습니다</p></div>';
    return;
  }

  const badgeClass = { ai: 'badge-ai', logistics: 'badge-logistics', automation: 'badge-automation' };
  const badgeLabel = { ai: 'AI', logistics: '물류', automation: '자동화' };

  grid.innerHTML = items.map(n => `
    <a class="card" href="${n.url}" target="_blank" rel="noopener noreferrer">
      <div class="card-top">
        <span class="badge ${badgeClass[n.category]}">${badgeLabel[n.category]}</span>
        <span class="time">${timeAgo(n.publishedAt)}</span>
      </div>
      <div class="card-title">${n.title}</div>
      ${n.summary ? `<div class="card-summary">${n.summary}</div>` : ''}
      <div class="card-source">${n.source}</div>
    </a>
  `).join('');
}

function setCategory(cat, btn) {
  currentCategory = cat;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

async function fetchFeed(feed) {
  const proxy = 'https://api.rss2json.com/v1/api.json?rss_url=';
  const res = await fetch(proxy + encodeURIComponent(feed.url));
  const data = await res.json();
  if (data.status !== 'ok') return [];
  return (data.items || []).slice(0, 10).map((item, i) => ({
    id: feed.source + i,
    title: item.title || '',
    summary: stripHtml(item.description || item.content || '').slice(0, 200),
    url: item.link || '#',
    source: feed.source,
    category: feed.category,
    publishedAt: item.pubDate || new Date().toISOString(),
  }));
}

async function loadNews(force = false) {
  const CACHE_KEY = 'news_cache';
  const CACHE_TS  = 'news_cache_ts';
  const TTL = 30 * 60 * 1000;

  if (!force) {
    const cached = localStorage.getItem(CACHE_KEY);
    const ts = parseInt(localStorage.getItem(CACHE_TS) || '0');
    if (cached && Date.now() - ts < TTL) {
      allNews = JSON.parse(cached);
      renderCards();
      document.getElementById('statusBar').textContent =
        `마지막 업데이트: ${new Date(ts).toLocaleString('ko-KR')} · ${allNews.length}개 기사 (캐시)`;
      return;
    }
  }

  showSkeleton();
  const results = await Promise.allSettled(FEEDS.map(fetchFeed));
  const fetched = results.flatMap(r => r.status === 'fulfilled' ? r.value : []);

  if (fetched.length > 0) {
    allNews = fetched.sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt));
    localStorage.setItem(CACHE_KEY, JSON.stringify(allNews));
    localStorage.setItem(CACHE_TS, Date.now().toString());
  } else {
    allNews = MOCK;
  }

  renderCards();
  const now = new Date().toLocaleString('ko-KR');
  document.getElementById('statusBar').textContent =
    `마지막 업데이트: ${now} · ${allNews.length}개 기사`;
}

loadNews();
</script>
</body>
</html>
